{%extends 'layout/base.html'%}

{%block content%}
<div class="alert alert-success">
    <div class="spinner-grow text-success"></div>
    <strong>Thanh toan thanh cong!</strong> Da thanh toan thanh cong 300.000.000d cho iPhone 36 Pro Max
</div>
<div class="container">
  <div class="row">
    {%for p in prods%}
    <div class="col-md-3 col-12" style="padding:0.7rem">
        <div class="card">
            <img class="card-img-top" src="{{p.image}}" alt="{{p.name}}" style="height:400px">
            <div class="card-body">
                <h4 class="card-title">{{p.name}}</h4>
                <p class="card-text">{{p.price}}</p>
                <a href="/products/{{p.id}}" class="btn btn-primary">Xem chi tiet</a>
                <a href="#" class="btn btn-danger">Mua</a>
            </div>
        </div>
    </div>
    {%endfor%}
</div>
</div>
{%endblock%}

</body>
</html>
